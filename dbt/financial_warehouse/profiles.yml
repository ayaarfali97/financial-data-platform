financial_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'fdp') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'fdp_local_pw') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'financial') }}"
      schema: analytics
      threads: 4
